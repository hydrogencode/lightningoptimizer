repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' } }
dependencies { 
    minecraft 'com.mojang:minecraft:1.20.1'; mappings 'net.fabricmc:yarn:1.20.1+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.22'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.85.0+1.20.1' 
}
